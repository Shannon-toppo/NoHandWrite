[project]
name = "nohandwrite"
version = "0.1.0"
description = "Learn a person's handwriting style from a few samples: beautify written characters (Fourier average) and generate unwritten ones (SDT)."
requires-python = ">=3.11"
dependencies = [
    "easydict>=1.13",
    "einops>=0.8.2",
    "fastapi>=0.115",
    "gdown>=6.1.0",
    "lmdb>=2.3.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "packaging>=26.2",
    "pillow>=12.3.0",
    "ptflops>=0.7.5",
    "pyyaml>=6.0.3",
    "six>=1.17.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/nohandwrite", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
