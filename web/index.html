<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NoHandWrite — 手書き入力</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>NoHandWrite 手書き入力</h1>
    <nav><a href="/"><b>✏️ 入力</b></a><a href="/library.html">📚 ライブラリ</a><a href="/generate.html">🖋 生成</a><a href="/typeset.html">🖨 組版</a></nav>
    <div class="row">
      <label>書き手ID <input id="writer" placeholder="例: taro" autocomplete="off"></label>
      <label>文字セット <select id="promptSet"></select></label>
      <span id="progress" class="badge"></span>
    </div>
    <div class="row" style="margin-top:6px">
      <label>回数 <input id="repeat" type="number" min="1" max="10" value="1" style="width:3.5em"></label>
      <select id="repeatOrder">
        <option value="loop">セット全体をN周(推奨)</option>
        <option value="consecutive">同じ文字を連続N回</option>
      </select>
      <label>入力枠 <input id="padSize" type="range" min="250" max="850" step="10" value="560" style="width:8em">
        <span id="padSizeVal" class="muted"></span></label>
    </div>
    <div class="row" style="margin-top:6px">
      <label>個別入力 <input id="singleChars" placeholder="例: 永" autocomplete="off" style="width:8em"></label>
      <button id="startSingle">この文字だけ書く</button>
    </div>
  </header>

  <section class="prompt-row">
    <div id="targetChar" class="target">–</div>
    <div class="prompt-info">
      <div id="strokeInfo">0 画目</div>
      <div id="sampleInfo"></div>
      <div id="setDescription" class="muted"></div>
    </div>
  </section>

  <div class="canvas-wrap">
    <canvas id="pad"></canvas>
  </div>

  <section class="buttons">
    <button id="undoStroke">一画戻す</button>
    <button id="clearAll">全部消す</button>
    <button id="skip">スキップ</button>
    <button id="save" class="primary">保存して次へ ▶</button>
  </section>
  <p id="status" class="muted"></p>
</main>
<script src="app.js"></script>
</body>
</html>
