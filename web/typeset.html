<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoHandWrite — 組版</title>
<link rel="stylesheet" href="style.css">
<style>
  main { width: min(860px, 100%); }
  textarea { width: 100%; font-size: 1.05rem; padding: 8px; border: 1px solid #bbb;
             border-radius: 8px; min-height: 4em; }
  fieldset { border: 1px solid #ccc; border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
  legend { font-size: 0.85rem; color: #555; padding: 0 6px; }
  .params { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 0.9rem; }
  .params label { display: flex; align-items: center; gap: 6px; }
  .params input[type="number"] { width: 5em; padding: 3px 5px; border: 1px solid #bbb; border-radius: 6px; }
  .params input[type="text"] { width: 9em; padding: 3px 5px; border: 1px solid #bbb; border-radius: 6px; }
  .jitter input[type="range"] { width: 7.5em; }
  .jitter output { font-variant-numeric: tabular-nums; min-width: 2em; color: #555; }
  .preview-wrap { margin-top: 12px; overflow: auto; background: #e3e3e0;
                  border: 1px solid #ccc; border-radius: 8px; padding: 16px; }
  #page { background: #fff; box-shadow: 0 1px 6px #0003; display: block; margin: 0 auto; }
  .pageinfo { font-size: 0.85rem; color: #555; margin-top: 6px; }
  nav a { margin-right: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>NoHandWrite 組版 → G-code</h1>
    <nav><a href="/">✏️ 入力</a><a href="/library.html">📚 ライブラリ</a><a href="/generate.html">🖋 生成</a><a href="/typeset.html"><b>🖨 組版</b></a></nav>
    <div class="row" style="margin-top:8px">
      <label>書き手 <select id="writerSel"></select></label>
      <label><input type="checkbox" id="smoothChk" checked> フーリエ平滑化</label>
    </div>
  </header>

  <p style="margin:10px 0 6px">文章(改行はそのまま改行になります):</p>
  <textarea id="text" placeholder="例: 木を植える人は&#10;林と森を育てる"></textarea>

  <fieldset>
    <legend>レイアウト (mm)</legend>
    <div class="params">
      <label>用紙 <select id="paperSel">
        <option value="">自由</option>
        <option value="210">A4 縦</option>
        <option value="297">A4 横</option>
        <option value="182">B5 縦</option>
        <option value="257">B5 横</option>
      </select></label>
      <label>文字サイズ <input id="charSize" type="number" value="15" min="1" max="200" step="0.5"></label>
      <label>文字間 <input id="charGap" type="number" value="1.5" min="-10" max="100" step="0.5"></label>
      <label>行間 <input id="lineGap" type="number" value="4" min="0" max="100" step="0.5"></label>
      <label>行の最大幅 <input id="maxWidth" type="number" value="180" min="10" max="2000" step="5"></label>
      <label>余白 <input id="margin" type="number" value="10" min="0" max="100" step="1"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>ゆらぎ(0 = 毎回同じ、1 = 標準、3 = 強)</legend>
    <div class="params jitter">
      <label>ひらがな <input id="jHiragana" type="range" value="1" min="0" max="3" step="0.1"><output for="jHiragana">1.0</output></label>
      <label>カタカナ <input id="jKatakana" type="range" value="1" min="0" max="3" step="0.1"><output for="jKatakana">1.0</output></label>
      <label>漢字 <input id="jKanji" type="range" value="1" min="0" max="3" step="0.1"><output for="jKanji">1.0</output></label>
      <label>英数字 <input id="jAlnum" type="range" value="1" min="0" max="3" step="0.1"><output for="jAlnum">1.0</output></label>
      <label>記号・その他 <input id="jOther" type="range" value="1" min="0" max="3" step="0.1"><output for="jOther">1.0</output></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>G-code(ペンプロッター)</legend>
    <div class="params">
      <label>描画送り(mm/min) <input id="feedDraw" type="number" value="1500" min="1" max="20000" step="100"></label>
      <label>移動送り(mm/min) <input id="feedTravel" type="number" value="3000" min="1" max="20000" step="100"></label>
      <label>ペン上げ <input id="penUp" type="text" value="G0 Z5.0"></label>
      <label>ペン下げ <input id="penDown" type="text" value="G1 Z0.0 F300"></label>
      <label><input type="checkbox" id="flipY" checked> Y軸反転(原点が手前左の機械向け)</label>
    </div>
  </fieldset>

  <div class="buttons" style="margin-top:10px">
    <button id="preview" class="primary">プレビュー ▶</button>
    <button id="dlGcode">G-code保存</button>
    <button id="dlSvg">SVG保存</button>
  </div>

  <div class="preview-wrap"><canvas id="page" width="10" height="10"></canvas></div>
  <p id="pageinfo" class="pageinfo"></p>
  <p id="status" class="muted"></p>
</main>
<script src="typeset.js"></script>
</body>
</html>
