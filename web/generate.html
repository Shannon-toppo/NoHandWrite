<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoHandWrite — 生成</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea { width: 100%; font-size: 1.1rem; padding: 8px; border: 1px solid #bbb;
             border-radius: 8px; min-height: 3em; }
  .out { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .cell { text-align: center; font-size: 0.75rem; color: #666; }
  .cell canvas { width: 110px; height: 110px; background: #fff; border-radius: 6px;
                 border: 2px solid #ccc; display: block; }
  .cell.average canvas, .cell.smooth canvas { border-color: #1a7f37; }
  .cell.generated canvas { border-color: #2559c9; }
  .cell.unavailable canvas { border-color: #c92525; }
  .legend { font-size: 0.85rem; color: #555; margin-top: 8px; }
  .legend b.avg { color: #1a7f37; } .legend b.gen { color: #2559c9; }
  nav a { margin-right: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>NoHandWrite 生成</h1>
    <nav><a href="/">✏️ 入力</a><a href="/library.html">📚 ライブラリ</a><a href="/generate.html"><b>🖋 生成</b></a><a href="/typeset.html">🖨 組版</a></nav>
    <div class="row" style="margin-top:8px">
      <label>書き手 <select id="writerSel"></select></label>
      <label><input type="checkbox" id="smoothChk" checked> フーリエ平滑化</label>
    </div>
  </header>
  <p style="margin:10px 0 6px">生成したいテキストを入力(書いた文字は平均文字、未入力の文字はAI生成):</p>
  <textarea id="text" placeholder="例: 林森は木から生まれる"></textarea>
  <div class="buttons" style="margin-top:8px">
    <button id="run" class="primary">この字体で生成 ▶</button>
    <button id="dlSvg">SVG保存</button>
    <button id="dlGcode">G-code保存</button>
    <label style="align-self:center;font-size:0.85rem">文字サイズ(mm) <input id="sizeMm" type="number" value="15" min="3" max="100" style="width:4em"></label>
  </div>
  <p class="legend"><b class="avg">緑枠: 自分の筆跡(平均/平滑化)</b> / <b class="gen">青枠: AI生成</b> / 赤枠: 生成不可</p>
  <div id="out" class="out"></div>
  <p id="status" class="muted"></p>
</main>
<script src="generate.js"></script>
</body>
</html>
