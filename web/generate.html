<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoHandWrite — 生成</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea { width: 100%; font-size: 1.1rem; padding: 8px; border: 1px solid #bbb;
             border-radius: 8px; min-height: 3em; }
  .out { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .cell { text-align: center; font-size: 0.75rem; color: #666; width: 114px; }
  .cell canvas { width: 110px; height: 110px; background: #fff; border-radius: 6px;
                 border: 2px solid #ccc; display: block; }
  .cell.average canvas, .cell.smooth canvas { border-color: #1a7f37; }
  .cell.generated canvas { border-color: #2559c9; }
  .cell.generated_weak canvas { border-color: #d98324; }
  .cell.unavailable canvas { border-color: #c92525; }
  .cell .warn { display: block; color: #a35c05; font-size: 0.68rem; line-height: 1.25;
                margin-top: 2px; overflow: hidden; display: -webkit-box;
                -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .cell .actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
                margin-top: 4px; }
  .cell .actions button, .cell .actions a { font-size: 0.68rem; padding: 2px 5px;
                border: 1px solid #bbb; border-radius: 6px; background: #fafafa;
                color: #333; text-decoration: none; cursor: pointer;
                white-space: nowrap; }
  .cell .actions button:disabled { opacity: 0.5; cursor: default; }
  .legend { font-size: 0.85rem; color: #555; margin-top: 8px; }
  fieldset { border: 1px solid #ccc; border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
  legend { font-size: 0.85rem; color: #555; padding: 0 6px; }
  .jitter { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 0.9rem; }
  .jitter label { display: flex; align-items: center; gap: 6px; }
  .jitter input[type="range"] { width: 7.5em; }
  .jitter output { font-variant-numeric: tabular-nums; min-width: 2em; color: #555; }
  .legend b.avg { color: #1a7f37; } .legend b.gen { color: #2559c9; }
  .legend b.weak { color: #d98324; }
  nav a { margin-right: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>NoHandWrite 生成</h1>
    <nav><a href="/">✏️ 入力</a><a href="/library.html">📚 ライブラリ</a><a href="/generate.html"><b>🖋 生成</b></a><a href="/typeset.html">🖨 組版</a></nav>
    <div class="row" style="margin-top:8px">
      <label>書き手 <select id="writerSel"></select></label>
      <label><input type="checkbox" id="smoothChk" checked> フーリエ平滑化</label>
    </div>
  </header>
  <p style="margin:10px 0 6px">生成したいテキストを入力(書いた文字は平均文字、未入力の文字はAI生成):</p>
  <textarea id="text" placeholder="例: 林森は木から生まれる"></textarea>
  <fieldset>
    <legend>ゆらぎ(0 = 毎回同じ、1 = 標準、3 = 強)</legend>
    <div class="jitter">
      <label>ひらがな <input id="jHiragana" type="range" value="1" min="0" max="3" step="0.1"><output for="jHiragana">1.0</output></label>
      <label>カタカナ <input id="jKatakana" type="range" value="1" min="0" max="3" step="0.1"><output for="jKatakana">1.0</output></label>
      <label>漢字 <input id="jKanji" type="range" value="1" min="0" max="3" step="0.1"><output for="jKanji">1.0</output></label>
      <label>英数字 <input id="jAlnum" type="range" value="1" min="0" max="3" step="0.1"><output for="jAlnum">1.0</output></label>
      <label>記号・その他 <input id="jOther" type="range" value="1" min="0" max="3" step="0.1"><output for="jOther">1.0</output></label>
    </div>
  </fieldset>
  <div class="buttons" style="margin-top:8px">
    <button id="run" class="primary">この字体で生成 ▶</button>
    <button id="dlSvg">SVG保存</button>
    <button id="dlGcode">G-code保存</button>
    <label style="align-self:center;font-size:0.85rem">文字サイズ(mm) <input id="sizeMm" type="number" value="15" min="3" max="100" style="width:4em"></label>
  </div>
  <p class="legend"><b class="avg">緑枠: 自分の筆跡(平均/平滑化)</b> / <b class="gen">青枠: AI生成</b> / <b class="weak">橙枠: AI生成(要確認)</b> / 赤枠: 生成不可<br>
  AI生成の字は「↻ 再生成」で引き直せます(毎回サンプリングし直すので結果が変わります)。うまくいかない字は「✏️ 自分で書く」から手書きしてください。</p>
  <div id="out" class="out"></div>
  <p id="status" class="muted"></p>
</main>
<script src="generate.js"></script>
</body>
</html>
